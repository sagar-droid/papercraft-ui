# Publishes to npm when a version tag is pushed, using npm trusted publishing (OIDC).
# No npm token is stored in GitHub: npm verifies this workflow's identity directly.
#
# One-time setup on npmjs.com (package must already exist):
#   papercraft-ui → Settings → Trusted Publisher → GitHub Actions
#   owner: sagar-droid, repository: papercraft-ui, workflow: release.yml
#
# Release: bump "version" in package.json, commit, then
#   git tag v0.1.1 && git push origin master --tags
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # ships npm 11, which supports trusted publishing
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1; don't rely on the version bundled with Node
      - run: npm install -g npm@latest && npm --version
      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # prepublishOnly runs typecheck + build
      - run: npm publish --access public
